<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>APEX RUSH</title><style>
*{box-sizing:border-box}body{margin:0;background:#070b12;color:#f3f7ff;font:14px system-ui;overflow:hidden;touch-action:none}canvas{display:block;width:100vw;height:100dvh;background:#101b20}#hud{position:fixed;inset:12px 12px auto;display:flex;gap:8px;justify-content:space-between;pointer-events:none;flex-wrap:wrap}.stat{background:#08111ddd;border:1px solid #365164;border-radius:10px;padding:8px 12px;min-width:78px}.stat b{display:block;font-size:20px;color:#7cf6ff}#start{position:fixed;inset:0;display:grid;place-items:center;background:#030711bb;padding:20px}#card{max-width:430px;width:100%;text-align:center;background:linear-gradient(145deg,#102336,#090e18);border:1px solid #477087;border-radius:20px;padding:25px}h1{font-size:clamp(30px,8vw,48px);line-height:1;margin:0 0 8px;letter-spacing:2px;color:#7cf6ff}button{border:0;border-radius:12px;background:#7cf6ff;color:#041018;font-weight:900;font-size:17px;padding:13px 18px;touch-action:none}#controls{position:fixed;bottom:18px;left:0;right:0;display:flex;justify-content:space-between;padding:0 18px;pointer-events:none}.cluster{display:flex;gap:9px;align-items:end;pointer-events:auto}.ctrl{width:58px;height:58px;border:1px solid #a6f8ff77;background:#0a182be8;color:white;border-radius:15px;font-size:23px;user-select:none}.gas{width:72px;height:72px;border-radius:50%;background:#b9ff62;color:#0b1703}.nitro{background:#ff9b55;color:#201005;font-size:12px}@media(min-width:800px){#controls{opacity:.8}}</style></head><body><canvas id="game"></canvas><div id="hud"><div class="stat">TEMPO<b id="speed">0 km/h</b></div><div class="stat">STRECKE<b id="dist">0 m</b></div><div class="stat">BEST<b id="best">0 m</b></div><div class="stat">NITRO<b id="nitro">100%</b></div></div><div id="controls"><div class="cluster"><button class="ctrl" data-key="left">◀</button><button class="ctrl" data-key="right">▶</button></div><div class="cluster"><button class="ctrl nitro" data-key="nitro">NITRO</button><button class="ctrl gas" data-key="gas">▲</button></div></div><div id="start"><div id="card"><h1>APEX RUSH</h1><p style="color:#b7c9d8">NEON HIGHWAY SPRINT</p><p>Weiche dem Verkehr aus, sammle Tempo und zünde Nitro auf der langen Geraden.</p><p><b>PC:</b> A/D oder Pfeiltasten lenken · W/↑ Gas · Shift Nitro<br><b>Touch:</b> Knöpfe unten</p><button id="go">RENNEN STARTEN</button><p id="result" style="min-height:20px;color:#7cf6ff"></p></div></div><script>
(()=>{'use strict';const c=document.getElementById('game'),ctx=c.getContext('2d'),$=id=>document.getElementById(id);let W,H,dpr,carX=0,speed=0,distance=0,nitro=100,active=false,spawn=0,offset=0,traffic=[],particles=[],keys={},best=0;try{best=+(localStorage.getItem('apexRushBest')||0)}catch(e){}$('best').textContent=Math.floor(best)+' m';
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener('resize',resize);resize();function road(){let w=Math.min(W*.78,470);return{x:W/2-w/2,w}}
function reset(){carX=0;speed=0;distance=0;nitro=100;spawn=0;offset=0;traffic=[];particles=[];active=true;$('start').style.display='none'}
$('go').onclick=reset;addEventListener('keydown',e=>{let k=e.key.toLowerCase();keys[k]=true;if(['arrowleft','arrowright','arrowup',' '].includes(k))e.preventDefault();if((k==='enter'||k===' ')&&!active)reset()},{passive:false});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);document.querySelectorAll('[data-key]').forEach(b=>{let k=b.dataset.key;const down=e=>{e.preventDefault();keys[k]=true},up=e=>{e.preventDefault();keys[k]=false};b.addEventListener('pointerdown',down);['pointerup','pointercancel','pointerleave'].forEach(ev=>b.addEventListener(ev,up))});
function box(x,y,w,h,r,color){ctx.fillStyle=color;ctx.beginPath();ctx.roundRect(x,y,w,h,r);ctx.fill()}function car(x,y,w,h,color,player=false){ctx.fillStyle='#0008';ctx.beginPath();ctx.ellipse(x,y+h*.22,w*.7,h*.5,0,0,Math.PI*2);ctx.fill();box(x-w/2,y-h/2,w,h,7,color);box(x-w*.34,y-h*.25,w*.68,h*.28,4,player?'#b8f8ff':'#c6dce8');box(x-w*.32,y+h*.12,w*.64,h*.18,3,player?'#122b40':'#1c2a35');ctx.fillStyle='#fff1a6';ctx.fillRect(x-w*.37,y-h*.43,w*.18,3);ctx.fillRect(x+w*.19,y-h*.43,w*.18,3);ctx.fillStyle='#ff354e';ctx.fillRect(x-w*.37,y+h*.39,w*.18,3);ctx.fillRect(x+w*.19,y+h*.39,w*.18,3)}
function drawRoad(){let r=road();ctx.fillStyle='#173126';ctx.fillRect(0,0,W,H);ctx.fillStyle='#343d49';ctx.fillRect(r.x,0,r.w,H);ctx.fillStyle='#f1efd4';ctx.fillRect(r.x+7,0,4,H);ctx.fillRect(r.x+r.w-11,0,4,H);ctx.fillStyle='#d2dce0';for(let lane=1;lane<=2;lane++){let x=r.x+r.w*lane/3;for(let y=-72+offset%72;y<H;y+=72)ctx.fillRect(x-2,y,4,38)}for(let y=-40+offset%100;y<H+40;y+=100){ctx.fillStyle='#8bf7e8';ctx.fillRect(r.x-22,y,4,12);ctx.fillRect(r.x+r.w+18,y,4,12)}}
let last=0;function frame(t){let dt=Math.min(.035,(t-last)/1000||0);last=t;let r=road(),cw=Math.max(25,Math.min(36,W*.075)),ch=cw*1.65,px=W/2+carX*r.w*.37,py=H*.78;if(active){let gas=keys.w||keys.arrowup||keys.gas,brake=keys.s||keys.arrowdown;if(gas)speed+=115*dt;else speed-=22*dt;if(brake)speed-=150*dt;let boost=(keys.shift||keys.nitro)&&nitro>0&&speed>70;if(boost){speed+=190*dt;nitro=Math.max(0,nitro-28*dt);for(let i=0;i<2;i++)particles.push({x:px+(Math.random()-.5)*16,y:py+ch*.5,v:90+Math.random()*130,life:.3,color:'#72e9ff'})}else nitro=Math.min(100,nitro+5*dt);speed=Math.max(0,Math.min(boost?360:260,speed));let steer=(keys.a||keys.arrowleft||keys.left?-1:0)+(keys.d||keys.arrowright||keys.right?1:0);carX=Math.max(-.86,Math.min(.86,carX+steer*dt*(1.15+speed/160)));if(Math.abs(carX)>.8)speed=Math.max(0,speed-80*dt);distance+=speed*dt*.42;offset+=speed*dt*1.1;spawn-=dt;if(spawn<=0&&speed>35){traffic.push({x:[-.66,0,.66][Math.floor(Math.random()*3)],y:-100,w:cw*.86,h:ch*.92,speed:35+Math.random()*95,color:['#ff725e','#f3c95f','#b7a0ff','#68d6a4'][Math.floor(Math.random()*4)]});spawn=Math.max(.45,1.25-speed/400)+Math.random()*.35}for(let o of traffic){o.y+=(speed*.9-o.speed)*dt+speed*dt*.8;if(Math.abs(o.x-carX)<.27&&Math.abs(o.y-py)<ch*.88){active=false;for(let i=0;i<20;i++)particles.push({x:px,y:py,v:Math.random()*190,life:.6,color:['#ff8b55','#ffed9e','#e7faff'][i%3]});if(distance>best){best=distance;try{localStorage.setItem('apexRushBest',Math.floor(best))}catch(e){}}$('best').textContent=Math.floor(best)+' m';$('start').style.display='grid';$('go').textContent='NOCHMAL FAHREN';$('result').textContent='Crash! Strecke: '+Math.floor(distance)+' m'}}traffic=traffic.filter(o=>o.y<H+100);$('speed').textContent=Math.floor(speed)+' km/h';$('dist').textContent=Math.floor(distance)+' m';$('nitro').textContent=Math.floor(nitro)+'%'}drawRoad();for(let o of traffic)car(W/2+o.x*r.w*.37,o.y,o.w,o.h,o.color);car(W/2+carX*r.w*.37,H*.78,cw,ch,'#42e6f5',true);for(let p of particles){p.y+=p.v*dt;p.life-=dt;ctx.globalAlpha=Math.max(0,p.life*2.8);ctx.fillStyle=p.color;ctx.fillRect(p.x,p.y,3,7)}ctx.globalAlpha=1;particles=particles.filter(p=>p.life>0);requestAnimationFrame(frame)}requestAnimationFrame(frame)})();
</script></body></html>
