<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GALAKTOGON — Beta 2</title>
<style>
:root{--bg:#050812;--p:#0b1220;--p2:#111b2d;--l:#263957;--t:#eaf3ff;--m:#8da0bb;--c:#62dcff;--g:#72efb0;--a:#ffd66e;--r:#ff667d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#173052,#050812 48%,#020409);color:var(--t);font:14px/1.45 system-ui,Segoe UI,sans-serif}button{font:inherit;color:var(--t);background:#14243a;border:1px solid #355274;border-radius:8px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--c)}.hidden{display:none!important}
#boot{min-height:100vh;display:grid;place-items:center;padding:25px}.boot{width:min(620px,100%);padding:30px;background:#08101ddd;border:1px solid #29415f;border-radius:16px}.logo{font-size:42px;letter-spacing:8px;color:var(--c)}.muted{color:var(--m)}.bar{height:8px;background:#162337;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--c)}
#game{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid var(--l);background:#070d18ee;padding:18px;position:sticky;top:0;height:100vh}.brand{font-weight:800;color:var(--c);letter-spacing:3px;margin-bottom:18px}.nav button{width:100%;margin:4px 0;text-align:left}.nav .active{border-color:var(--c);background:#14304a}.main{padding:20px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.stats{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 10px;background:#0d1829;border:1px solid var(--l);border-radius:999px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 6;background:#0b1220dd;border:1px solid var(--l);border-radius:14px;padding:16px}.wide{grid-column:span 12}.card h2{margin:0 0 10px}.accent{color:var(--c)}.meter{height:9px;background:#162236;border-radius:8px;overflow:hidden;margin:6px 0 12px}.meter i{display:block;height:100%;background:var(--c)}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #1b2b43}.row:last-child{border:0}.actions{display:flex;flex-wrap:wrap;gap:8px}.stars{height:380px;position:relative;overflow:hidden;background:#030811;border-radius:12px;border:1px solid #20334d}.star{position:absolute;width:6px;height:6px;border-radius:50%;background:#bcefff;box-shadow:0 0 8px var(--c);cursor:pointer}.ship{position:absolute;width:20px;height:8px;background:var(--c);border-radius:50%;box-shadow:0 0 18px var(--c);transform:translate(-50%,-50%)}.log{height:170px;overflow:auto;background:#050a12;border:1px solid #1c2c42;padding:10px;font:12px ui-monospace,monospace}.tag{display:inline-block;border:1px solid #385272;border-radius:5px;padding:2px 6px;margin:2px}.mission{padding:12px;border:1px solid #263b58;border-radius:10px;margin:8px 0;background:#0d1727}
@media(max-width:800px){#game{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--l)}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav button{margin:0}.card{grid-column:span 12}.logo{font-size:30px}.top{align-items:flex-start;flex-direction:column}}
</style></head>
<style>
:root{--c:#62dcff;--t:#eaf3ff;--m:#8da0bb}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02050c;color:var(--t);font:14px/1.4 system-ui,Segoe UI,sans-serif}.hidden{display:none!important}button{font:inherit}
#boot{min-height:100vh;display:grid;place-items:center;padding:25px}.boot{width:min(620px,100%);padding:30px;background:#08101ddd;border:1px solid #29415f;border-radius:16px}.logo{font-size:42px;letter-spacing:8px;color:var(--c)}.muted{color:var(--m)}.bar{height:8px;background:#162337;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--c)}
#game{position:relative;width:100%;height:100%;background:#050812}#world{position:absolute;inset:0;width:100%;height:100%;cursor:crosshair}.hud{position:absolute;top:0;left:0;right:0;padding:18px 22px;display:flex;justify-content:space-between;gap:15px;background:linear-gradient(#02050cdd,transparent);pointer-events:none}.brand{font-weight:800;letter-spacing:3px;color:var(--c)}.stats{display:flex;gap:8px;flex-wrap:wrap}.stats span{padding:7px 10px;background:#081522cc;border:1px solid #29415f;border-radius:999px}.stats b{color:var(--c)}#hint{position:absolute;bottom:18px;left:50%;transform:translateX(-50%);padding:9px 14px;background:#07111dcc;border:1px solid #29415f;border-radius:8px;color:#b8cbe0;pointer-events:none;text-align:center}#interact{position:absolute;left:50%;bottom:70px;transform:translateX(-50%);padding:10px 16px;background:#071522eF;border:1px solid var(--c);border-radius:10px;text-align:center;box-shadow:0 0 20px #62dcff33}#interact b{color:var(--c)}#message{position:absolute;top:75px;left:50%;transform:translateX(-50%) translateY(-10px);opacity:0;padding:10px 16px;background:#081522ee;border:1px solid var(--c);border-radius:8px;transition:.2s;pointer-events:none}#message.show{opacity:1;transform:translateX(-50%) translateY(0)}
@media(max-width:700px){.hud{padding:12px;display:block}.stats{margin-top:8px}.brand{font-size:12px}.stats span{font-size:12px;padding:5px 8px}#hint{bottom:10px;font-size:12px;width:90%}}
</style><body>
<div id="boot"><div class="boot"><div class="logo">GALAKTOGON</div><div class="muted">FRONTIER PROTOCOL // BETA 3</div><p id="msg">Initialisiere 3D-Umgebung…</p><div class="bar"><i id="prog"></i></div></div></div>
<div id="game" class="hidden">
  <canvas id="world"></canvas>
  <div class="hud">
    <div class="brand">GALAKTOGON // FRONTIER</div>
    <div class="stats"><span>LV <b id="lv">1</b></span><span>XP <b id="xp">0</b></span><span>GC <b id="gc">500</b></span><span>HÜLLE <b id="hull">100</b>%</span></div>
  </div>
  <div id="hint">WASD / Pfeiltasten = Laufen · Maus = Kamera · E = Interagieren</div>
  <div id="interact" class="hidden"><b id="interactTitle">Terminal</b><br><span id="interactText">E drücken</span></div>
  <div id="message"></div>
</div>
<script>
const SUPABASE_URL="https://tkbopzdurmejcwawtswa.supabase.co",SUPABASE_KEY="sb_publishable_NaSGbCf_A8HrrPV6O9D0ig_0tiFPA6D",STORAGE_KEY="sb-tkbopzdurmejcwawtswa-auth-token";
let cloudUser=null,cloudToken=null,cloudSaveChain=Promise.resolve();
function getSession(){try{const s=JSON.parse(localStorage.getItem(STORAGE_KEY)||"null");if(s?.access_token){cloudToken=s.access_token;return s}}catch{}return null}
async function cloudApi(path,options={}){const h=new Headers(options.headers||{});h.set("apikey",SUPABASE_KEY);h.set("Content-Type","application/json");if(cloudToken)h.set("Authorization","Bearer "+cloudToken);const r=await fetch(SUPABASE_URL+path,{...options,headers:h});const txt=await r.text();let data=null;try{data=txt?JSON.parse(txt):null}catch{}if(!r.ok)throw new Error(data?.message||data?.msg||data?.error_description||("HTTP "+r.status));return data}
async function cloudLoad(){const s=getSession();if(!s)return false;try{const u=await cloudApi("/auth/v1/user");if(!u?.id)return false;cloudUser=u;const d=await cloudApi("/rest/v1/game_saves?select=save_data&user_id=eq."+encodeURIComponent(u.id)+"&game_id=eq.galaktogon-beta-2");if(Array.isArray(d)&&d[0]?.save_data){S={...S,...d[0].save_data};localStorage.setItem("GALA_BETA2",JSON.stringify(S));return true}}catch(e){}return false}
function cloudSave(){if(!cloudUser||!cloudToken)return Promise.resolve();const snap=JSON.parse(JSON.stringify(S));cloudSaveChain=cloudSaveChain.then(async()=>{try{await cloudApi("/rest/v1/game_saves",{method:"POST",headers:{"Prefer":"resolution=merge-duplicates,return=minimal"},body:JSON.stringify({user_id:cloudUser.id,game_id:"galaktogon-beta-2",save_data:snap,updated_at:new Date().toISOString()})})}catch(e){}}).catch(()=>{});return cloudSaveChain}
const $=id=>document.getElementById(id);
let S=JSON.parse(localStorage.getItem("GALA_BETA2")||"null")||{name:"Nova",race:"Terraner",level:1,xp:0,gc:500,rep:0,hull:100,energy:100,hyper:100,sector:7,planet:"Asterion",inv:["Standard-Blaster","Medkit","Hyperzelle"],missions:[],logs:[],faction:"Neutral",kills:0};
function save(){localStorage.setItem("GALA_BETA2",JSON.stringify(S));stats();void cloudSave()}
function stats(){$("lv").textContent=S.level;$("xp").textContent=S.xp;$("gc").textContent=S.gc;$("hull").textContent=Math.max(0,S.hull)}
function addXP(n){S.xp+=n;while(S.xp>=S.level*100){S.xp-=S.level*100;S.level++;show("RANGAUFSTIEG // LEVEL "+S.level)}save()}
function show(x){$("message").textContent=x;$("message").classList.add("show");clearTimeout(show.t);show.t=setTimeout(()=>$("message").classList.remove("show"),2600)}
function log(x){S.logs.unshift(new Date().toLocaleTimeString()+" // "+x);S.logs=S.logs.slice(0,40);save()}

const c=$("world"),ctx=c.getContext("2d"),keys={},mouse={x:0,y:0,drag:false};
let W=innerWidth,H=innerHeight,dpr=Math.min(2,devicePixelRatio||1),px=0,py=0,angle=0,camYaw=0,last=performance.now(),near=null;
const world={w:2600,h:1900};
const objects=[
 {x:1300,y:950,w:260,h:150,type:"base",name:"Frontier-Kommando"},
 {x:760,y:620,w:120,h:90,type:"terminal",name:"Missions-Terminal"},
 {x:1850,y:540,w:120,h:90,type:"terminal",name:"Forschungs-Terminal"},
 {x:520,y:1370,w:170,h:100,type:"crate",name:"Versorgungskiste"},
 {x:2020,y:1320,w:180,h:110,type:"ship",name:"Landeschiff"}
];
const rocks=Array.from({length:70},(_,i)=>({x:70+((i*347)%2460),y:70+((i*613)%1760),s:15+(i%4)*8}));
function resize(){W=innerWidth;H=innerHeight;c.width=W*dpr;c.height=H*dpr;c.style.width=W+"px";c.style.height=H+"px";ctx.setTransform(dpr,0,0,dpr,0,0)}addEventListener("resize",resize);resize();
function resetPlayer(){px=1300;py=1120;angle=0}
resetPlayer();
addEventListener("keydown",e=>{keys[e.key.toLowerCase()]=true;if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"," "].includes(e.key.toLowerCase()))e.preventDefault();if(e.key.toLowerCase()==="e")interact()});
addEventListener("keyup",e=>keys[e.key.toLowerCase()]=false);
c.addEventListener("mousedown",e=>{mouse.drag=true;mouse.x=e.clientX});addEventListener("mouseup",()=>mouse.drag=false);addEventListener("mousemove",e=>{if(mouse.drag){camYaw+=(e.clientX-mouse.x)*.006;mouse.x=e.clientX}});
c.addEventListener("touchstart",e=>{mouse.drag=true;mouse.x=e.touches[0].clientX},{passive:true});c.addEventListener("touchend",()=>mouse.drag=false);c.addEventListener("touchmove",e=>{if(mouse.drag){camYaw+=(e.touches[0].clientX-mouse.x)*.006;mouse.x=e.touches[0].clientX}},{passive:true});

function blocked(nx,ny){if(nx<55||ny<55||nx>world.w-55||ny>world.h-55)return true;for(const o of objects){if(Math.abs(nx-o.x)<o.w/2+28&&Math.abs(ny-o.y)<o.h/2+28)return true}return false}
function move(dt){let fx=0,fy=0;if(keys.w||keys.arrowup)fy-=1;if(keys.s||keys.arrowdown)fy+=1;if(keys.a||keys.arrowleft)fx-=1;if(keys.d||keys.arrowright)fx+=1;if(!fx&&!fy)return;const len=Math.hypot(fx,fy);fx/=len;fy/=len;const ca=Math.cos(camYaw),sa=Math.sin(camYaw);const dx=(fx*ca-fy*sa)*250*dt,dy=(fx*sa+fy*ca)*250*dt;const nx=px+dx,ny=py+dy;if(!blocked(nx,py))px=nx;if(!blocked(px,ny))py=ny;angle=Math.atan2(dy,dx)+Math.PI/2}
function camera(){return {x:px,y:py}}
function project(x,y){const dx=x-px,dy=y-py;const ca=Math.cos(-camYaw),sa=Math.sin(-camYaw);return {x:dx*ca-dy*sa,y:dx*sa+dy*ca}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle="#07101b";ctx.fillRect(0,0,W,H);const horizon=H*.37;const g=ctx.createLinearGradient(0,0,0,H);g.addColorStop(0,"#02050c");g.addColorStop(.37,"#071321");g.addColorStop(1,"#101d28");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);
const scale=Math.min(W,H)/900;const objects2=[...rocks.map(r=>({...r,w:r.s,h:r.s,type:"rock"})),...objects,{x:px,y:py,w:38,h:26,type:"player"}].map(o=>({...o,p:project(o.x,o.y)})).sort((a,b)=>a.p.y-b.p.y);
for(const o of objects2){const depth=Math.max(.55,1-o.p.y/1500),sx=o.w*scale*depth,sy=o.h*scale*depth;const screenX=W/2+o.p.x*scale*.9,screenY=horizon+(o.p.y+650)*scale*.38;
if(o.type==="rock"){ctx.fillStyle="#283849";ctx.beginPath();ctx.ellipse(screenX,screenY,sx,sy*.7,0,0,Math.PI*2);ctx.fill();continue}
if(o.type==="player"){drawPlayer(screenX,screenY,scale*depth);continue}
ctx.fillStyle=o.type==="terminal"?"#173b50":o.type==="ship"?"#273744":o.type==="base"?"#162b3d":"#4a3c26";ctx.fillRect(screenX-sx/2,screenY-sy/2,sx,sy);ctx.strokeStyle=o.type==="terminal"?"#62dcff":"#48647c";ctx.strokeRect(screenX-sx/2,screenY-sy/2,sx,sy);
if(o.name){ctx.fillStyle="#dceeff";ctx.font="12px system-ui";ctx.textAlign="center";ctx.fillText(o.name,screenX,screenY-sy/2-7)}
}
drawGroundGrid(scale,horizon);
near=findNear();$("interact").classList.toggle("hidden",!near);if(near){$("interactTitle").textContent=near.name;$("interactText").textContent="E drücken, um zu interagieren"}}
function drawGroundGrid(scale,horizon){ctx.strokeStyle="rgba(98,220,255,.10)";ctx.lineWidth=1;for(let i=-12;i<=12;i++){const x=W/2+i*70;ctx.beginPath();ctx.moveTo(x,horizon);ctx.lineTo(W/2+i*170,H);ctx.stroke()}for(let j=0;j<10;j++){const y=horizon+j*j*5+30;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y);ctx.stroke()}}
function drawPlayer(x,y,s){ctx.save();ctx.translate(x,y);ctx.rotate(angle-camYaw);ctx.fillStyle="#0a1825";ctx.beginPath();ctx.ellipse(0,5,17*s,8*s,0,0,Math.PI*2);ctx.fill();ctx.fillStyle="#62dcff";ctx.beginPath();ctx.moveTo(0,-24*s);ctx.lineTo(-13*s,15*s);ctx.lineTo(13*s,15*s);ctx.closePath();ctx.fill();ctx.fillStyle="#eaf3ff";ctx.beginPath();ctx.arc(0,-20*s,7*s,0,Math.PI*2);ctx.fill();ctx.restore()}
function findNear(){let best=null,bd=Infinity;for(const o of objects){const d=Math.hypot(o.x-px,o.y-py);if(d<170&&d<bd){best=o;bd=d}}return best}
function interact(){if(!near)return;if(near.type==="terminal"){addXP(15);S.gc+=25;log("MISSION // Terminal synchronisiert // +15 XP / +25 GC");show("MISSIONSDATEN EMPFANGEN");}else if(near.type==="crate"){S.inv.push("Energiezelle");S.energy=Math.min(100,S.energy+20);addXP(10);log("VERSORGUNG // Kiste geplündert");show("VERSORGUNG GEFUNDEN");}else if(near.type==="ship"){S.hyper=Math.min(100,S.hyper+30);show("LANDESCHIFF // Hyperdrive +30");log("SCHIFF // Hyperdrive geladen")}else{show("FRONTIER-KOMMANDO // Basis erreicht");addXP(5)}save()}
function loop(now){const dt=Math.min(.04,(now-last)/1000);last=now;move(dt);draw();requestAnimationFrame(loop)}
let p=0,t=setInterval(async()=>{p+=10;$("prog").style.width=p+"%";$("msg").textContent=["Initialisiere 3D-Umgebung…","Lade Frontier-Welt…","Synchronisiere Pilot…","Berechne Terrain…","Setze Spielerfigur…","Bereit."][Math.min(5,Math.floor(p/20))];if(p>=100){clearInterval(t);try{await Promise.race([cloudLoad(),new Promise(r=>setTimeout(()=>r(false),8000))])}catch(e){}$("boot").classList.add("hidden");$("game").classList.remove("hidden");stats();requestAnimationFrame(loop)}} ,120);
</script></body></html>
