<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GALAKTOGON — Beta 2</title>
<style>
:root{--bg:#050812;--p:#0b1220;--p2:#111b2d;--l:#263957;--t:#eaf3ff;--m:#8da0bb;--c:#62dcff;--g:#72efb0;--a:#ffd66e;--r:#ff667d}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 50% -10%,#173052,#050812 48%,#020409);color:var(--t);font:14px/1.45 system-ui,Segoe UI,sans-serif}button{font:inherit;color:var(--t);background:#14243a;border:1px solid #355274;border-radius:8px;padding:9px 12px;cursor:pointer}button:hover{border-color:var(--c)}.hidden{display:none!important}
#boot{min-height:100vh;display:grid;place-items:center;padding:25px}.boot{width:min(620px,100%);padding:30px;background:#08101ddd;border:1px solid #29415f;border-radius:16px}.logo{font-size:42px;letter-spacing:8px;color:var(--c)}.muted{color:var(--m)}.bar{height:8px;background:#162337;border-radius:20px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--c)}
#game{min-height:100vh;display:grid;grid-template-columns:220px 1fr}.side{border-right:1px solid var(--l);background:#070d18ee;padding:18px;position:sticky;top:0;height:100vh}.brand{font-weight:800;color:var(--c);letter-spacing:3px;margin-bottom:18px}.nav button{width:100%;margin:4px 0;text-align:left}.nav .active{border-color:var(--c);background:#14304a}.main{padding:20px;max-width:1400px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-bottom:15px}.stats{display:flex;gap:8px;flex-wrap:wrap}.chip{padding:7px 10px;background:#0d1829;border:1px solid var(--l);border-radius:999px}.grid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}.card{grid-column:span 6;background:#0b1220dd;border:1px solid var(--l);border-radius:14px;padding:16px}.wide{grid-column:span 12}.card h2{margin:0 0 10px}.accent{color:var(--c)}.meter{height:9px;background:#162236;border-radius:8px;overflow:hidden;margin:6px 0 12px}.meter i{display:block;height:100%;background:var(--c)}.row{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid #1b2b43}.row:last-child{border:0}.actions{display:flex;flex-wrap:wrap;gap:8px}.stars{height:380px;position:relative;overflow:hidden;background:#030811;border-radius:12px;border:1px solid #20334d}.star{position:absolute;width:6px;height:6px;border-radius:50%;background:#bcefff;box-shadow:0 0 8px var(--c);cursor:pointer}.ship{position:absolute;width:20px;height:8px;background:var(--c);border-radius:50%;box-shadow:0 0 18px var(--c);transform:translate(-50%,-50%)}.log{height:170px;overflow:auto;background:#050a12;border:1px solid #1c2c42;padding:10px;font:12px ui-monospace,monospace}.tag{display:inline-block;border:1px solid #385272;border-radius:5px;padding:2px 6px;margin:2px}.mission{padding:12px;border:1px solid #263b58;border-radius:10px;margin:8px 0;background:#0d1727}
@media(max-width:800px){#game{grid-template-columns:1fr}.side{height:auto;position:static;border-right:0;border-bottom:1px solid var(--l)}.nav{display:grid;grid-template-columns:repeat(3,1fr);gap:5px}.nav button{margin:0}.card{grid-column:span 12}.logo{font-size:30px}.top{align-items:flex-start;flex-direction:column}}
</style></head>
<body>
<section id="boot"><div class="boot"><div class="logo">GALAKTOGON</div><div class="muted">FRONTIER PROTOCOL // BETA 2</div><p id="msg">Initialisiere Sektorkern…</p><div class="bar"><i id="prog"></i></div></div></section>
<section id="game" class="hidden"><aside class="side"><div class="brand">GALAKTOGON</div><div class="muted" id="pilot"></div><div class="nav">
<button data-v="home">Kommando</button><button data-v="galaxy">Galaxie</button><button data-v="missions">Missionen</button><button data-v="ship">Schiff</button><button data-v="inventory">Inventar</button><button data-v="training">Ausbildung</button><button data-v="factions">Fraktionen</button><button data-v="codex">Codex</button>
</div></aside><main class="main"><div class="top"><div><div class="muted">SEKTOR 07 // FRONTIER</div><h1 id="title">Kommandozentrum</h1></div><div class="stats"><span class="chip">LV <b id="lv">1</b></span><span class="chip">XP <b id="xp">0</b></span><span class="chip">GC <b id="gc">500</b></span><span class="chip">Ruf <b id="rep">0</b></span></div></div><div id="view"></div></main></section>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL="https://tkbopzdurmejcwawtswa.supabase.co",SUPABASE_KEY="sb_publishable_NaSGbCf_A8HrrPV6O9D0ig_0tiFPA6D";
const supabase=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let cloudUser=null;
async function cloudLoad(){const {data:{user}}=await supabase.auth.getUser();cloudUser=user;if(!user)return;const {data}=await supabase.from("game_saves").select("save_data").eq("user_id",user.id).eq("game_id","galaktogon-beta-2").maybeSingle();if(data&&data.save_data){S={...S,...data.save_data};localStorage.setItem("GALA_BETA2",JSON.stringify(S));stats()}}
async function cloudSave(){if(!cloudUser)return;await supabase.from("game_saves").upsert({user_id:cloudUser.id,game_id:"galaktogon-beta-2",save_data:S,updated_at:new Date().toISOString()},{onConflict:"user_id,game_id"})}
const $=x=>document.getElementById(x);let S=JSON.parse(localStorage.getItem("GALA_BETA2")||"null")||{name:"Nova",race:"Terraner",level:1,xp:0,gc:500,rep:0,hull:100,energy:100,hyper:100,sector:7,planet:"Asterion",inv:["Standard-Blaster","Medkit","Hyperzelle"],missions:[],logs:[],faction:"Neutral",kills:0};
function save(){localStorage.setItem("GALA_BETA2",JSON.stringify(S));stats();cloudSave()}function log(x){S.logs.unshift(new Date().toLocaleTimeString()+" // "+x);S.logs=S.logs.slice(0,40);save()}function addXP(n){S.xp+=n;while(S.xp>=S.level*100){S.xp-=S.level*100;S.level++;log("RANGAUFSTIEG // Level "+S.level)}save()}function stats(){$("lv").textContent=S.level;$("xp").textContent=S.xp;$("gc").textContent=S.gc;$("rep").textContent=S.rep;$("pilot").textContent=S.name+" // "+S.race}
function nav(v){document.querySelectorAll(".nav button").forEach(b=>b.classList.toggle("active",b.dataset.v===v));$("title").textContent={home:"Kommandozentrum",galaxy:"Galaxie",missions:"Missionen",ship:"Schiff",inventory:"Inventar",training:"Ausbildung",factions:"Fraktionen",codex:"Codex"}[v];({home,galaxy,missions,ship,inventory,training,factions,codex}[v])()}document.querySelectorAll(".nav button").forEach(b=>b.onclick=()=>nav(b.dataset.v));
function home(){$("view").innerHTML=`<div class="grid"><div class="card wide"><h2>Frontier-Status</h2><p>Willkommen zurück, <span class="accent">${S.name}</span>. Drei unbekannte Signale wurden außerhalb bekannter Routen registriert.</p><div class="actions"><button onclick="signal()">Signal analysieren</button><button onclick="addXP(10);log('Routine-Quest abgeschlossen // +10 XP');nav('home')">Routine-Quest</button></div></div><div class="card"><h2>Schiffssysteme</h2><div>Hülle <b>${S.hull}%</b></div><div class="meter"><i style="width:${S.hull}%"></i></div><div>Energie <b>${S.energy}%</b></div><div class="meter"><i style="width:${S.energy}%"></i></div><div>Hyperdrive <b>${S.hyper}%</b></div><div class="meter"><i style="width:${S.hyper}%"></i></div></div><div class="card"><h2>Aktive Missionen</h2><p>${S.missions.length?S.missions.map(x=>'<span class="tag">'+x+'</span>').join(""):"Keine aktiven Missionen."}</p><button onclick="nav('missions')">Missionsnetz</button></div><div class="card wide"><h2>Systemprotokoll</h2><div class="log">${S.logs.map(x=>"<div>"+x+"</div>").join("")||"Noch keine Ereignisse."}</div></div></div>`}
function signal(){let a=["Das Signal antwortet mit einem unvollständigen Sternencode.","Eine fremde Sonde wird entdeckt und verschwindet im Hyperraum.","Die Daten enthalten ein unbekanntes Symbol."];log("ANALYSE // "+a[Math.floor(Math.random()*a.length)]);addXP(15);nav("home")}
function galaxy(){let stars=Array.from({length:85},()=>'<span class="star" style="left:'+(3+Math.random()*94)+'%;top:'+(5+Math.random()*90)+'%" onclick="travel()"></span>').join("");$("view").innerHTML=`<div class="grid"><div class="card wide"><h2>Sternkarte</h2><p class="muted">Stern anklicken = Hyperraumroute berechnen.</p><div class="stars">${stars}<span class="ship" style="left:50%;top:52%"></span></div></div><div class="card"><h2>Standort</h2><div style="font-size:28px;font-weight:800">${S.planet}</div><p>Sektor ${S.sector}. Hyperdrive bereit.</p><button onclick="travel()">Zufällige Route</button></div></div>`}
function travel(){if(S.hyper<15){log("HYPERDRIVE // Energie nicht ausreichend.");nav("galaxy");return}S.hyper-=15;let n=["Asterion","Vhalis","Nereid","Khepri","Orison","Tau Ceti IV","Erebos","Morrow"];S.planet=n[Math.floor(Math.random()*n.length)];S.sector=Math.floor(Math.random()*30)+1;log("HYPERSPRUNG // "+S.planet);addXP(10);nav("galaxy")}
function missions(){let p=[["Signal im Dunkel","Untersuche eine unbekannte Frequenz."],["Grenzpatrouille","Scanne Navigationspunkte."],["Verlorene Fracht","Finde eine Transportkapsel."],["Uldaner-Spur","Sichere ein Archivfragment."]];$("view").innerHTML='<div class="grid"><div class="card wide"><h2>Missionsnetz</h2>'+p.map((m,i)=>'<div class="mission"><b>'+m[0]+'</b><div class="muted">'+m[1]+'</div><button onclick="mission(\''+m[0]+'\','+i+')">Annehmen / abschließen</button></div>').join("")+'</div></div>'}
function mission(n,i){if(S.missions.includes(n)){S.missions=S.missions.filter(x=>x!==n);S.gc+=80+i*30;S.rep+=2;addXP(25+i*5);log("MISSION ABGESCHLOSSEN // "+n)}else{S.missions.push(n);log("MISSION AKTIV // "+n);save()}nav("missions")}
function ship(){$("view").innerHTML=`<div class="grid"><div class="card"><h2>Schiffsdiagnostik</h2><div class="row"><span>Hülle</span><b>${S.hull}%</b></div><div class="row"><span>Energie</span><b>${S.energy}%</b></div><div class="row"><span>Hyperdrive</span><b>${S.hyper}%</b></div><div class="actions"><button onclick="repair()">Reparieren 50 GC</button><button onclick="boost()">Energie umleiten</button></div></div><div class="card"><h2>Gefahrensimulation</h2><p>Piratenkontakt simulieren.</p><button onclick="combat()">Kampf starten</button></div></div>`}
function repair(){if(S.gc<50){log("WERFT // Nicht genug GC.");return}S.gc-=50;S.hull=Math.min(100,S.hull+35);save();nav("ship")}function boost(){S.energy=Math.min(100,S.energy+25);S.hyper=Math.max(0,S.hyper-10);log("SYSTEM // Energie umgeleitet.");nav("ship")}
function combat(){if(Math.random()>.3){let r=100+Math.floor(Math.random()*100);S.gc+=r;S.rep+=4;addXP(30);log("KAMPF // Sieg // +"+r+" GC")}else{let d=10+Math.floor(Math.random()*31);S.hull-=d;S.energy=Math.max(0,S.energy-20);log("KAMPF // Treffer // -"+d+" Hülle");if(S.hull<=0){S.hull=25;S.gc=Math.floor(S.gc*.7);log("NOTFALL // Schiff geborgen // 30% GC verloren.")}}save();nav("ship")}
function inventory(){$("view").innerHTML='<div class="grid"><div class="card wide"><h2>Inventar</h2>'+S.inv.map((x,i)=>'<div class="row"><span>'+x+'</span><button onclick="useItem('+i+')">Benutzen</button></div>').join("")+'</div></div>'}function useItem(i){let x=S.inv[i];if(x==="Medkit"){S.hull=Math.min(100,S.hull+25);S.inv.splice(i,1);log("MEDKIT // Hülle repariert.")}else if(x==="Hyperzelle"){S.hyper=Math.min(100,S.hyper+35);S.inv.splice(i,1);log("HYPERZELLE // Hyperdrive geladen.")}else log(x+" // Standardausrüstung.");save();nav("inventory")}
function training(){$("view").innerHTML='<div class="grid"><div class="card"><h2>Ausbildungssektor</h2><p>Trainiere Fähigkeiten und erhalte XP.</p><div class="mission"><b>Navigation</b><p class="muted">Routenplanung.</p><button onclick="train(20)">Trainieren +20 XP</button></div><div class="mission"><b>Schiffskampf</b><p class="muted">Energiemanagement.</p><button onclick="train(25)">Trainieren +25 XP</button></div></div><div class="card"><h2>Karriere</h2><p>Aktueller Rang: <span class="accent">Kadett</span></p></div></div>'}function train(n){addXP(n);log("AUSBILDUNG // Training abgeschlossen.");nav("training")}
function factions(){$("view").innerHTML=`<div class="grid"><div class="card wide"><h2>Fraktionen</h2><p>Deine Entscheidungen verändern deinen Ruf.</p><div class="row"><span>Frontier-Allianz</span><button onclick="join('Alliance')">Kontakt</button></div><div class="row"><span>Freie Piraten</span><button onclick="join('Pirates')">Kontakt</button></div><p>Aktuell: <b>${S.faction}</b></p></div></div>`}function join(f){if(S.faction==="Pirates"&&f!=="Pirates")return log("ENTSCHEIDUNG // Piratenpfad ist irreversibel.");S.faction=f;if(f==="Pirates"){S.rep-=10;log("ENTSCHEIDUNG // Piratenpfad gewählt. Irreversibel.")}else{S.rep+=5;log("DIPLOMATIE // Allianz gewinnt Vertrauen.")}save();nav("factions")}
function codex(){$("view").innerHTML='<div class="grid"><div class="card"><h2>Codex</h2><p><span class="tag">Uldaner</span> Eine verschwundene Zivilisation. Ihre Archive reagieren auf unbekannte Signale.</p><p><span class="tag">Hyperdrive</span> FTL-Reisen verbrauchen Energie.</p><p><span class="tag">Frontier</span> Grenzraum voller Handel und Konflikte.</p></div><div class="card"><h2>Beta 2</h2><p>Spielbarer Prototyp. Fortschritt wird lokal gespeichert.</p><button onclick="localStorage.removeItem('GALA_BETA2');location.reload()">Spielstand zurücksetzen</button></div></div>'}
function create(){if(localStorage.getItem("GALA_BETA2"))return;S.name=prompt("Name des Piloten:","Nova")||"Nova";S.race=prompt("Rasse: Terraner, Avari, Krynn, Myr, Solari, Veyra, Nox, Orin","Terraner")||"Terraner";save();log("CHARAKTER ERSTELLT // "+S.name+" // "+S.race)}
let p=0,t=setInterval(()=>{p+=10;$("prog").style.width=p+"%";$("msg").textContent=["Initialisiere Sektorkern…","Synchronisiere Sternkarte…","Prüfe Schiffssysteme…","Lade Missionsnetz…","Uldaner-Archiv versiegelt.","Bereit."][Math.min(5,Math.floor(p/20))];if(p>=100){clearInterval(t);$("boot").classList.add("hidden");$("game").classList.remove("hidden");create();stats();await cloudLoad();stats();nav("home")}},120);
</script></body></html>
